services:
  - type: web
    name: school-connect-api
    runtime: node
    rootDir: school-connect-api
    buildCommand: npm ci && npm run prisma:generate && npm run build
    startCommand: npm run prisma:deploy && npm start
    healthCheckPath: /api/v1/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_ACCESS_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 30d
      - key: CORS_ORIGIN
        sync: false
      - key: LOG_LEVEL
        value: info
      - key: LLM_PROVIDER
        value: stub
      - key: LLM_TIMEOUT_MS
        value: 30000
      - key: SMS_ENABLED
        value: "false"
      - key: SMS_PROVIDER
        value: stub
      - key: SMS_MAX_ATTEMPTS
        value: "3"
      - key: SMS_RETRY_BASE_DELAY_MS
        value: "30000"
      - key: SMS_WORKER_INTERVAL_MS
        value: "15000"
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_API_KEY
        sync: false
      - key: TWILIO_API_SECRET
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM
        sync: false
      - key: TWILIO_MESSAGING_SERVICE_SID
        sync: false
